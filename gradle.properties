org.gradle.jvmargs=-Xmx1G
org.gradle.caching=false
org.gradle.configuration-cache=false

# ---------------------------------------------------------------
# Hytale (read by com.azuredoom.hytale-tools)
# src/main/resources/manifest.json is regenerated from these values
# on every build, so edit them here rather than in the manifest.
# ---------------------------------------------------------------

# Server version to compile against, and which patchline (release / pre-release)
hytale_version=0.+
hytale_patchline=release

# Manifest fields
manifest_group=ExampleGroup
mod_id=ExamplePlugin
mod_description=An example plugin for Hytale!
# Comma-separated authors, each as "Name" or "Name|Email|Url"
mod_credits="It's you!"
mod_url=
main_class=com.example.exampleplugin.ExamplePlugin
includes_pack=true

# Comma-separated "Group:Name=versionRange" entries
manifest_dependencies=Hytale:AssetModule=*,Hytale:EntityModule=*
manifest_opt_dependencies=

# Uncomment to pin ServerVersion; defaults to ">=<resolved server version>"
# manifest_server_version=*
